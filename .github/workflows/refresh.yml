name: Refresh derived badminton data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions: {}
jobs:
  update:
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run data:research
      - run: npm run data:build
      - run: node scripts/validate-archive.mjs
      - run: npm test
      - run: npm run build
      - name: Commit verified data
        id: publish
        run: |
          git config user.name 'archive-data-bot'
          git config user.email 'archive-data-bot@users.noreply.github.com'
          git add public/data/archive.json src/archive.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh derived BWF aggregates'
            git push
            printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: update
    if: needs.update.outputs.revision != ''
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.revision }}
