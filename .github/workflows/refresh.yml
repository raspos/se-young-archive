name: Refresh derived badminton data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run data:research
      - run: npm run data:build
      - run: npm test
      - run: npm run build
      - name: Commit derived data only
        run: |
          git config user.name 'archive-data-bot'
          git config user.email 'archive-data-bot@users.noreply.github.com'
          git add public/data/archive.json src/archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh derived BWF aggregates'
            git push
          fi
